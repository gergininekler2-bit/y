<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Windows 98 Not ve Referans Arşivi</title>

<style>
:root{
  --desktop:#d8eef7;
  --desktop-2:#eff8fb;
  --window:#f3f3ed;
  --window-soft:#fbfbf5;
  --border-dark:#404040;
  --border-mid:#9a9a9a;
  --border-light:#ffffff;
  --blue:#001f86;
  --blue-2:#2e65b7;
  --aqua:#78c7d3;
  --mint:#b7e3c6;
  --green:#7fb081;
  --text:#111;
  --muted:#6b6b6b;
  --danger:#b74040;
}

body.dark{
  --desktop:#1e3138;
  --desktop-2:#2f4d57;
  --window:#2f3c42;
  --window-soft:#394b52;
  --border-dark:#0d1417;
  --border-mid:#77909a;
  --border-light:#607882;
  --blue:#112d70;
  --blue-2:#284f94;
  --aqua:#4f8d99;
  --mint:#456f57;
  --green:#78a37a;
  --text:#edf6f8;
  --muted:#b8c8cd;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Tahoma,Verdana,Arial,sans-serif;
  font-size:13px;
  background:
    radial-gradient(circle at 78% 75%, rgba(255,255,255,.8), transparent 24%),
    linear-gradient(145deg,var(--desktop-2),var(--desktop) 45%,#c9e6ef);
}

body.dark{
  background:linear-gradient(145deg,var(--desktop),var(--desktop-2));
}

button,input,textarea,select{
  font-family:Tahoma,Verdana,Arial,sans-serif;
  font-size:13px;
}

.app{
  max-width:1180px;
  margin:0 auto;
  padding:18px;
}

.window{
  background:var(--window);
  border:2px solid;
  border-color:var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
  box-shadow:2px 2px 0 rgba(0,0,0,.22);
}

.titlebar{
  min-height:26px;
  padding:4px 7px;
  color:white;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(90deg,var(--blue),var(--blue-2),var(--aqua));
}

.titlebar small{
  font-weight:normal;
  opacity:.9;
}

.closebox{
  width:18px;
  height:18px;
  color:#000;
  background:#d8d8d0;
  border:2px solid;
  border-color:#fff #555 #555 #fff;
  text-align:center;
  line-height:13px;
  font-weight:bold;
}

.content{
  padding:12px;
}

.hero{
  min-height:120px;
  padding:20px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.45)),
    repeating-linear-gradient(0deg,transparent,transparent 13px,rgba(120,199,211,.12) 14px),
    linear-gradient(135deg,#eefaff,#d7eef6);
  border-bottom:1px solid var(--border-mid);
}

body.dark .hero{
  background:linear-gradient(135deg,#304952,#26383f);
}

.logo{
  font-size:27px;
  letter-spacing:-1px;
}

.logo b{
  font-weight:900;
}

.logo span{
  color:#1c6b3c;
}

.main-grid{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:12px;
}

.sidebar-title{
  color:white;
  background:#0a0a0a;
  padding:5px 8px;
  letter-spacing:3px;
  font-size:11px;
  margin-bottom:6px;
}

.side-item{
  display:block;
  width:100%;
  text-align:left;
  padding:7px 8px;
  margin-bottom:4px;
  background:#f6f6ee;
  color:#111;
  border:0;
  border-left:5px solid var(--aqua);
  cursor:pointer;
}

.side-item:hover{
  background:#fff;
  border-left-color:var(--green);
}

.panel{
  background:var(--window-soft);
  border:2px solid;
  border-color:var(--border-light) var(--border-mid) var(--border-mid) var(--border-light);
  padding:10px;
  margin-bottom:10px;
}

.btn{
  cursor:pointer;
  padding:7px 10px;
  background:#dcdcd4;
  color:#111;
  border:2px solid;
  border-color:#fff #505050 #505050 #fff;
  box-shadow:1px 1px 0 rgba(0,0,0,.15);
}

.btn:hover{
  filter:brightness(1.04);
}

.btn:active{
  border-color:#505050 #fff #fff #505050;
  transform:translateY(1px);
}

.btn.full{
  width:100%;
  margin:4px 0;
}

.btn.danger{
  color:#fff;
  background:var(--danger);
  border-color:#eaa #612 #612 #eaa;
}

input,textarea,select{
  width:100%;
  padding:7px;
  color:#111;
  background:white;
  border:2px solid;
  border-color:#555 #fff #fff #555;
  outline:none;
}

body.dark input,
body.dark textarea,
body.dark select{
  background:#eaf2f3;
  color:#111;
}

textarea{
  resize:vertical;
  line-height:1.55;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.ref-card{
  min-height:92px;
  text-align:left;
  background:linear-gradient(180deg,#fbfbf5,#e6f1ec);
  border:2px solid;
  border-color:#fff #777 #777 #fff;
  padding:12px;
  cursor:pointer;
}

.ref-card:hover{
  background:linear-gradient(180deg,#fff,#dff3e7);
}

.ref-card b{
  display:block;
  font-size:18px;
  margin-bottom:6px;
}

.note-block{
  margin-bottom:12px;
}

.reference-info{
  min-height:34px;
  padding:8px;
  margin-bottom:0;
  color:var(--muted);
  background:rgba(255,255,255,.58);
  border:2px solid;
  border-color:#fff #aaa #aaa #fff;
}

.info-tag{
  display:inline-block;
  margin:2px 4px 2px 0;
  padding:4px 7px;
  color:#5b686d;
  background:rgba(224,242,236,.75);
  border:1px solid #a9c8bc;
}

.editor{
  min-height:330px;
  border-top:0;
  font-size:15px;
}

.meta{
  color:var(--muted);
  font-size:12px;
}

.note-list-item{
  padding:8px;
  margin-bottom:7px;
  cursor:pointer;
  background:#fbfbf5;
  border:1px solid var(--border-mid);
}

.note-list-item:hover{
  background:#fff;
}

.archive-list{
  display:grid;
  gap:7px;
}

.archive-item{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center;
  gap:6px;
  padding:7px;
  background:#fbfbf5;
  border:1px solid var(--border-mid);
}

.tools{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

hr{
  border:0;
  border-top:1px solid var(--border-mid);
  border-bottom:1px solid var(--border-light);
  margin:12px 0;
}

::-webkit-scrollbar{width:14px}
::-webkit-scrollbar-track{background:#d7e8ec;border-left:1px solid #8aa}
::-webkit-scrollbar-thumb{
  background:#c9d7d8;
  border:2px solid;
  border-color:#fff #777 #777 #fff;
}

@media(max-width:760px){
  .app{padding:10px}
  .main-grid{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr}
  .archive-item{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app" id="app"></div>

<script>
const CATEGORIES=["Mekan","Nesne","Zaman","Kişi","Eylem","Duygu"];

const defaultRefs={
  "Mekan":["Kafe","Kütüphane","Metro","Orman"],
  "Nesne":["Anahtar","Eski defter","Radyo","Saat"],
  "Zaman":["Gece yarısı","Sabah","Yağmurlu akşam","1998"],
  "Kişi":["Dedektif","Yabancı","Çocuk","Garson"],
  "Eylem":["Beklemek","Kaçmak","Araştırmak","Hatırlamak"],
  "Duygu":["Gerilim","Merak","Hüzün","Umut"]
};

let state={
  notes:read("w98_notes",[]),
  refs:read("w98_refs",defaultRefs),
  theme:read("w98_theme","light")
};

if(state.theme==="dark") document.body.classList.add("dark");

function read(key,fallback){
  try{return JSON.parse(localStorage.getItem(key)) ?? fallback}
  catch{return fallback}
}

function save(){
  localStorage.setItem("w98_notes",JSON.stringify(state.notes));
  localStorage.setItem("w98_refs",JSON.stringify(state.refs));
  localStorage.setItem("w98_theme",JSON.stringify(state.theme));
}

function escapeHtml(str){
  return String(str||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function dateText(ts){
  return new Date(ts).toLocaleString("tr-TR");
}

function shell(title,body){
  document.getElementById("app").innerHTML=`
    <div class="window">
      <div class="titlebar">
        <span>Welcome to Windows 98 Notes</span>
        <span class="closebox">×</span>
      </div>
      <div class="hero">
        <div class="logo">Microsoft <b>Windows<span>98</span></b></div>
        <p>Retro not yazma ve referans kutuları sistemi</p>
      </div>
      <div class="content">${body}</div>
    </div>
  `;
}

function home(){
  const sorted=[...state.notes].sort((a,b)=>b.updated-b.updated);
  const recent=[...state.notes]
    .sort((a,b)=>b.updated-a.updated)
    .slice(0,8)
    .map(n=>`
      <div class="note-list-item" onclick="openNote(${n.id})">
        <b>${escapeHtml(n.title||"Adsız Not")}</b><br>
        <span class="meta">Son düzenleme: ${dateText(n.updated)}</span>
      </div>
    `).join("");

  const cards=CATEGORIES.map(cat=>`
    <button class="ref-card" onclick="archive('${cat}')">
      <b>${cat}</b>
      <span>${state.refs[cat]?.length||0} kayıt</span>
    </button>
  `).join("");

  shell("home",`
    <div class="main-grid">
      <aside>
        <div class="sidebar-title">CONTENTS</div>
        <button class="side-item" onclick="newNote()">Register Now / Yeni Not</button>
        <button class="side-item" onclick="document.getElementById('noteSearch').focus()">Connect to Notes / Not Ara</button>
        <button class="side-item" onclick="toggleTheme()">Discover Theme / Tema Değiştir</button>
        <button class="side-item" onclick="exportJSON()">Maintain Backup / JSON Dışa Aktar</button>

        <div class="panel">
          <button class="btn full" onclick="newNote()">Yeni Not Oluştur</button>
          <input id="noteSearch" placeholder="Not arama..." oninput="searchNotes(this.value)">
          <div id="searchResults"></div>
        </div>

        <div class="panel">
          <b>Son Notlara Devam Et</b>
          <hr>
          ${recent || `<span class="meta">Henüz not yok.</span>`}
        </div>

        <div class="panel">
          <b>Veri Araçları</b>
          <button class="btn full" onclick="exportJSON()">JSON Dışa Aktar</button>
          <input type="file" accept="application/json" onchange="importJSON(event)">
        </div>
      </aside>

      <section>
        <div class="panel">
          <h2>Welcome</h2>
          <p>Not yazmaya başlayabilir veya sağdaki referans kutularını düzenleyebilirsin.</p>
        </div>

        <div class="cards">${cards}</div>

        <div class="panel" style="margin-top:10px">
          <b>Bugünün İlham Kartı</b>
          <hr>
          ${todayInspiration()}
        </div>
      </section>
    </div>
  `);
}

function todayInspiration(){
  return CATEGORIES.map(cat=>{
    const arr=state.refs[cat]||[];
    const value=arr.length ? arr[Math.floor(Math.random()*arr.length)] : "-";
    return `<span class="info-tag">${cat}: ${escapeHtml(value)}</span>`;
  }).join("");
}

function newNote(){
  const note={
    id:Date.now(),
    title:"",
    body:"",
    refs:{},
    created:Date.now(),
    updated:Date.now()
  };
  state.notes.unshift(note);
  save();
  openNote(note.id);
}

function openNote(id){
  const note=state.notes.find(n=>n.id===id);
  if(!note){home();return}

  const refTags=CATEGORIES
    .filter(cat=>note.refs[cat])
    .map(cat=>`<span class="info-tag">${cat}: ${escapeHtml(note.refs[cat])}</span>`)
    .join("");

  const selects=CATEGORIES.map(cat=>`
    <label>${cat}</label>
    <select onchange="setNoteRef(${id},'${cat}',this.value)">
      <option value="">Seçilmedi</option>
      ${(state.refs[cat]||[]).map(item=>`
        <option value="${escapeHtml(item)}" ${note.refs[cat]===item?"selected":""}>
          ${escapeHtml(item)}
        </option>
      `).join("")}
    </select>
  `).join("");

  shell("note",`
    <button class="btn" onclick="home()">Ana Sayfaya Dön</button>

    <div class="panel note-block">
      <div class="titlebar" style="margin:-10px -10px 10px">
        <span>Yeni Not Oluşturma Ekranı</span>
        <small>AutoSave aktif</small>
      </div>

      <input
        id="titleInput"
        placeholder="Not başlığı"
        value="${escapeHtml(note.title)}"
        oninput="updateNote(${id})"
      >

      <div class="reference-info">
        ${refTags || "Seçilen mekan, kişi, duygu ve diğer referanslar burada soluk bilgi etiketi olarak görünecek."}
      </div>

      <textarea
        id="bodyInput"
        class="editor"
        placeholder="Notunu buraya yaz..."
        oninput="updateNote(${id})"
      >${escapeHtml(note.body)}</textarea>

      <div class="meta">
        Oluşturulma: ${dateText(note.created)} · Son düzenleme: ${dateText(note.updated)}
      </div>
    </div>

    <div class="panel">
      <div class="titlebar" style="margin:-10px -10px 10px">
        <span>Referans Seçimi</span>
      </div>

      <div class="tools">${selects}</div>

      <hr>

      <button class="btn" onclick="randomRefs(${id})">Rastgele Referans Üret</button>
      <button class="btn danger" onclick="deleteNote(${id})">Notu Sil</button>
    </div>
  `);
}

function updateNote(id){
  const note=state.notes.find(n=>n.id===id);
  note.title=document.getElementById("titleInput").value;
  note.body=document.getElementById("bodyInput").value;
  note.updated=Date.now();
  save();
}

function setNoteRef(id,cat,value){
  const note=state.notes.find(n=>n.id===id);
  if(value) note.refs[cat]=value;
  else delete note.refs[cat];
  note.updated=Date.now();
  save();
  openNote(id);
}

function randomRefs(id){
  const note=state.notes.find(n=>n.id===id);
  CATEGORIES.forEach(cat=>{
    const arr=state.refs[cat]||[];
    if(arr.length) note.refs[cat]=arr[Math.floor(Math.random()*arr.length)];
  });
  note.updated=Date.now();
  save();
  openNote(id);
}

function deleteNote(id){
  if(!confirm("Bu not silinsin mi?")) return;
  state.notes=state.notes.filter(n=>n.id!==id);
  save();
  home();
}

function searchNotes(q){
  const target=document.getElementById("searchResults");
  if(!target) return;

  q=q.trim().toLowerCase();
  if(!q){target.innerHTML="";return}

  target.innerHTML=state.notes
    .filter(n=>(n.title+" "+n.body).toLowerCase().includes(q))
    .sort((a,b)=>b.updated-a.updated)
    .map(n=>`
      <div class="note-list-item" onclick="openNote(${n.id})">
        <b>${escapeHtml(n.title||"Adsız Not")}</b><br>
        <span class="meta">${dateText(n.updated)}</span>
      </div>
    `).join("") || `<span class="meta">Sonuç yok.</span>`;
}

function archive(cat){
  shell("archive",`
    <button class="btn" onclick="home()">Ana Sayfaya Dön</button>

    <div class="panel">
      <div class="titlebar" style="margin:-10px -10px 10px">
        <span>${cat} Arşivi</span>
      </div>

      <input id="archiveSearch" placeholder="Arama..." oninput="renderArchive('${cat}')">

      <hr>

      <label>Tek tek öğe ekle</label>
      <input id="singleItem" placeholder="Örnek: Kafe">
      <button class="btn" onclick="addSingle('${cat}')">Ekle</button>

      <hr>

      <label>Toplu öğe ekle</label>
      <textarea id="bulkItems" rows="6" placeholder="Ev&#10;Kütüphane&#10;Metro&#10;Orman&#10;&#10;veya: Ev, Kütüphane, Metro, Orman"></textarea>
      <button class="btn" onclick="addBulk('${cat}')">Toplu Ekle</button>
    </div>

    <div class="panel">
      <b>Mevcut Öğeler</b>
      <hr>
      <div id="archiveList" class="archive-list"></div>
    </div>
  `);

  renderArchive(cat);
}

function addSingle(cat){
  const input=document.getElementById("singleItem");
  const value=input.value.trim();
  if(!value) return;
  state.refs[cat].push(value);
  state.refs[cat]=[...new Set(state.refs[cat])];
  save();
  archive(cat);
}

function addBulk(cat){
  const text=document.getElementById("bulkItems").value;
  const items=text.split(/,|\n/).map(x=>x.trim()).filter(Boolean);
  state.refs[cat].push(...items);
  state.refs[cat]=[...new Set(state.refs[cat])];
  save();
  archive(cat);
}

function renderArchive(cat){
  const q=(document.getElementById("archiveSearch")?.value||"").toLowerCase();
  const list=document.getElementById("archiveList");
  const items=(state.refs[cat]||[])
    .map((value,index)=>({value,index}))
    .filter(x=>x.value.toLowerCase().includes(q));

  list.innerHTML=items.map(({value,index})=>`
    <div class="archive-item">
      <span>${escapeHtml(value)}</span>
      <button class="btn" onclick="editArchiveItem('${cat}',${index})">Düzenle</button>
      <button class="btn danger" onclick="deleteArchiveItem('${cat}',${index})">Sil</button>
    </div>
  `).join("") || `<span class="meta">Kayıt yok.</span>`;
}

function editArchiveItem(cat,index){
  const oldValue=state.refs[cat][index];
  const next=prompt("Yeni değer:",oldValue);
  if(!next) return;
  state.refs[cat][index]=next.trim();
  save();
  archive(cat);
}

function deleteArchiveItem(cat,index){
  state.refs[cat].splice(index,1);
  save();
  archive(cat);
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  state.theme=document.body.classList.contains("dark") ? "dark" : "light";
  save();
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="windows98-not-arsivi.json";
  a.click();
}

function importJSON(event){
  const file=event.target.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);
      state.notes=imported.notes||[];
      state.refs=imported.refs||defaultRefs;
      state.theme=imported.theme||"light";
      save();
      document.body.classList.toggle("dark",state.theme==="dark");
      home();
    }catch{
      alert("JSON dosyası okunamadı.");
    }
  };
  reader.readAsText(file);
}

home();
</script>
</body>
</html>
