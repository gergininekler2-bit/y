<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows 98 Not ve Referans Arşivi</title>

  <style>
    /* =========================================================
       Windows 98 inspired single-file app
       ========================================================= */

    :root{
      /* Light theme */
      --desktop-bg: #bfc7ce;
      --desktop-bg-2: #d7dde3;
      --window-bg: #c0c0c0;
      --window-bg-soft: #d4d4d4;
      --panel-bg: #d9d9d9;
      --field-bg: #ffffff;
      --text: #111111;
      --muted: #5a5a5a;
      --titlebar-start: #0a2f8f;
      --titlebar-end: #2b65c8;
      --titlebar-text: #ffffff;
      --bevel-light: #ffffff;
      --bevel-mid: #dfdfdf;
      --bevel-dark: #808080;
      --bevel-darker: #404040;
      --shadow: rgba(0,0,0,.18);

      --accent-soft: #dfe7ef;
      --accent-blue: #8fb0d8;
      --accent-green: #9fc4a5;
      --accent-teal: #9cbfc8;

      --terminal-shell: #c0c0c0;
      --terminal-header: #b9b9b9;
      --terminal-screen: #081008;
      --terminal-screen-2: #0b140b;
      --terminal-text: #8af19b;
      --terminal-muted: #5da06a;
      --terminal-placeholder: #5c8b65;
      --terminal-border: #202020;
    }

    body.dark{
      --desktop-bg: #1f252b;
      --desktop-bg-2: #2a3138;
      --window-bg: #2f343a;
      --window-bg-soft: #3a4148;
      --panel-bg: #353c43;
      --field-bg: #f1f4f7;
      --text: #eef2f5;
      --muted: #c8d0d7;
      --titlebar-start: #143a92;
      --titlebar-end: #3566c6;
      --titlebar-text: #ffffff;
      --bevel-light: #6e7984;
      --bevel-mid: #56616d;
      --bevel-dark: #1a1f24;
      --bevel-darker: #0d1115;
      --shadow: rgba(0,0,0,.34);

      --accent-soft: #404a54;
      --accent-blue: #5b7fab;
      --accent-green: #648f6a;
      --accent-teal: #66858f;

      --terminal-shell: #30353a;
      --terminal-header: #40484f;
      --terminal-screen: #050805;
      --terminal-screen-2: #0a0f0a;
      --terminal-text: #9cffad;
      --terminal-muted: #6cbb7b;
      --terminal-placeholder: #64936d;
      --terminal-border: #000000;
    }

    *{ box-sizing: border-box; }

    html, body{
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body{
      font-family: Tahoma, Verdana, Arial, sans-serif;
      font-size: 13px;
      color: var(--text);
      background:
        linear-gradient(180deg, var(--desktop-bg-2), var(--desktop-bg));
    }

    .app{
      max-width: 1220px;
      margin: 0 auto;
      padding: 18px;
    }

    /* =========================================================
       Generic Win98 styles
       ========================================================= */
    .win-window{
      background: var(--window-bg);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-darker) var(--bevel-darker) var(--bevel-light);
      box-shadow: 2px 2px 0 var(--shadow);
    }

    .win-titlebar{
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 3px 6px;
      color: var(--titlebar-text);
      font-weight: bold;
      background: linear-gradient(90deg, var(--titlebar-start), var(--titlebar-end));
      user-select: none;
    }

    .win-titlebar-left{
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .win-titlebar-left span{
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .win-titlebar-dot{
      width: 11px;
      height: 11px;
      background: #f0f3f7;
      border: 1px solid rgba(255,255,255,.45);
    }

    .win-controls{
      display: flex;
      gap: 2px;
    }

    .win-control{
      width: 17px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      line-height: 1;
      color: #111;
      background: var(--window-bg);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-darker) var(--bevel-darker) var(--bevel-light);
    }

    .win-content{
      padding: 14px;
    }

    .status-bar{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 12px;
    }

    .status-pane{
      padding: 4px 8px;
      background: var(--panel-bg);
      border: 2px solid;
      border-color: var(--bevel-darker) var(--bevel-light) var(--bevel-light) var(--bevel-darker);
      color: var(--muted);
      font-size: 12px;
    }

    .section{
      margin-bottom: 12px;
      padding: 10px;
      background: var(--panel-bg);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
    }

    .section-title{
      margin: -10px -10px 10px -10px;
      padding: 5px 8px;
      font-weight: bold;
      color: #000;
      background: linear-gradient(180deg, #dadada, #c2c2c2);
      border-bottom: 1px solid var(--bevel-dark);
    }

    body.dark .section-title{
      color: #f6f8fb;
      background: linear-gradient(180deg, #485059, #394047);
      border-bottom-color: #20252b;
    }

    .tabs{
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-bottom: 10px;
    }

    .tab{
      padding: 5px 10px;
      border: 2px solid;
      border-bottom: none;
      border-color: var(--bevel-light) var(--bevel-dark) transparent var(--bevel-light);
      background: #d6d6d6;
      color: #111;
      font-size: 12px;
      cursor: default;
    }

    body.dark .tab{
      background: #40474e;
      color: #f1f4f7;
      border-color: #6f7a84 #1b2025 transparent #6f7a84;
    }

    .tab.active{
      background: var(--window-bg);
      position: relative;
      top: 1px;
      font-weight: bold;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 12px;
      background: var(--window-bg);
      color: var(--text);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-darker) var(--bevel-darker) var(--bevel-light);
      cursor: pointer;
      text-decoration: none;
      user-select: none;
    }

    .btn:hover{
      filter: brightness(1.02);
    }

    .btn:active{
      border-color: var(--bevel-darker) var(--bevel-light) var(--bevel-light) var(--bevel-darker);
      padding-top: 7px;
      padding-bottom: 5px;
    }

    .btn.full{ width: 100%; }

    .btn.danger{
      color: #ffffff;
      background: #a94444;
      border-color: #e1b2b2 #4d1515 #4d1515 #e1b2b2;
    }

    .btn.subtle{
      background: var(--panel-bg);
    }

    .toolbar{
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    label{
      display: block;
      margin: 8px 0 4px;
      font-weight: bold;
    }

    input, textarea, select{
      width: 100%;
      padding: 7px 8px;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      font-size: 13px;
      color: #111;
      background: var(--field-bg);
      border: 2px solid;
      border-color: var(--bevel-darker) var(--bevel-light) var(--bevel-light) var(--bevel-darker);
      outline: none;
    }

    input::placeholder, textarea::placeholder{
      color: #707070;
    }

    textarea{
      resize: vertical;
      line-height: 1.45;
    }

    .muted{
      color: var(--muted);
    }

    .small{
      font-size: 12px;
    }

    .helper{
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .divider{
      height: 2px;
      margin: 12px 0;
      background: linear-gradient(180deg, var(--bevel-dark), var(--bevel-light));
      opacity: .9;
    }

    /* =========================================================
       Layouts
       ========================================================= */
    .home-grid{
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px;
    }

    .notes-search-results{
      margin-top: 8px;
      display: grid;
      gap: 6px;
      max-height: 240px;
      overflow: auto;
    }

    .recent-list{
      display: grid;
      gap: 8px;
      max-height: 420px;
      overflow: auto;
    }

    .recent-card{
      padding: 8px;
      background: var(--window-bg-soft);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
      cursor: pointer;
    }

    .recent-card:hover{
      background: #e6e6e6;
    }

    body.dark .recent-card:hover{
      background: #46505a;
    }

    .recent-title{
      font-weight: bold;
      margin-bottom: 4px;
    }

    .category-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .category-btn{
      width: 100%;
      min-height: 92px;
      padding: 10px;
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 10px;
      align-items: center;
      text-align: left;
      background: linear-gradient(180deg, #d7d7d7, #c5c5c5);
      color: var(--text);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-darker) var(--bevel-darker) var(--bevel-light);
      cursor: pointer;
    }

    body.dark .category-btn{
      background: linear-gradient(180deg, #444c55, #343b43);
    }

    .category-btn:hover{
      filter: brightness(1.03);
    }

    .category-btn:active{
      border-color: var(--bevel-darker) var(--bevel-light) var(--bevel-light) var(--bevel-darker);
    }

    .category-icon{
      width: 38px;
      height: 38px;
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
      background: linear-gradient(180deg, #edf2f7, #cfd8e2);
      position: relative;
    }

    body.dark .category-icon{
      background: linear-gradient(180deg, #7b8b99, #56636f);
    }

    .category-icon::before,
    .category-icon::after{
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      height: 5px;
      background: var(--cat-color, #8ca6c7);
      border: 1px solid rgba(0,0,0,.18);
    }

    .category-icon::before{ top: 8px; }
    .category-icon::after{ top: 18px; }

    .category-name{
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .category-meta{
      color: var(--muted);
      font-size: 12px;
    }

    .inspiration-wrap{
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .info-chip{
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid #9b9b9b;
      background: #ececec;
      color: #404040;
      font-size: 12px;
    }

    body.dark .info-chip{
      background: #46505a;
      border-color: #72808c;
      color: #eef3f7;
    }

    /* =========================================================
       Note editor / terminal
       ========================================================= */
    .note-layout{
      display: grid;
      gap: 12px;
    }

    .terminal-shell{
      background: var(--terminal-shell);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-darker) var(--bevel-darker) var(--bevel-light);
      overflow: hidden;
    }

    .terminal-topbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 8px;
      background: linear-gradient(180deg, var(--terminal-header), #a9a9a9);
      color: #111;
      border-bottom: 1px solid #6a6a6a;
      font-weight: bold;
    }

    body.dark .terminal-topbar{
      color: #f6f8fa;
      background: linear-gradient(180deg, #4a535c, #394149);
      border-bottom-color: #1a1f24;
    }

    .terminal-inner{
      position: relative;
      padding: 10px;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,.02) 0px,
          rgba(255,255,255,.02) 1px,
          transparent 2px,
          transparent 4px
        ),
        linear-gradient(180deg, var(--terminal-screen), var(--terminal-screen-2));
    }

    .terminal-refline{
      min-height: 38px;
      padding: 6px;
      margin-bottom: 0;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(120,160,120,.28);
      color: var(--terminal-muted);
      font-family: "Courier New", Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .terminal-chip{
      display: inline-block;
      margin: 2px 6px 2px 0;
      padding: 2px 6px;
      color: var(--terminal-text);
      border: 1px solid rgba(120,255,150,.22);
      background: rgba(40,80,40,.18);
      opacity: .92;
    }

    .terminal-textarea{
      min-height: 360px;
      padding: 12px;
      margin-top: 0;
      background: transparent;
      color: var(--terminal-text);
      border: none;
      outline: none;
      resize: vertical;
      box-shadow: none;
      font-family: "Courier New", Consolas, monospace;
      font-size: 15px;
      line-height: 1.62;
      caret-color: var(--terminal-text);
    }

    .terminal-textarea::placeholder{
      color: var(--terminal-placeholder);
      opacity: 1;
    }

    .terminal-status{
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 8px;
      color: var(--terminal-muted);
      font-family: "Courier New", Consolas, monospace;
      font-size: 12px;
    }

    .reference-grid{
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .reference-card{
      padding: 10px;
      background: var(--window-bg-soft);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
    }

    /* =========================================================
       Archive
       ========================================================= */
    .archive-grid{
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 12px;
    }

    .archive-list{
      display: grid;
      gap: 8px;
      max-height: 560px;
      overflow: auto;
    }

    .archive-item{
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: var(--window-bg-soft);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-dark) var(--bevel-dark) var(--bevel-light);
    }

    .archive-item-value{
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* =========================================================
       Responsive
       ========================================================= */
    @media (max-width: 900px){
      .home-grid,
      .archive-grid{
        grid-template-columns: 1fr;
      }

      .reference-grid{
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 640px){
      .app{ padding: 10px; }
      .category-grid,
      .reference-grid{
        grid-template-columns: 1fr;
      }

      .archive-item{
        grid-template-columns: 1fr;
      }

      .toolbar{
        flex-direction: column;
      }
    }

    /* =========================================================
       Scrollbar
       ========================================================= */
    ::-webkit-scrollbar{
      width: 14px;
      height: 14px;
    }

    ::-webkit-scrollbar-track{
      background: var(--window-bg);
      border-left: 1px solid var(--bevel-dark);
      border-top: 1px solid var(--bevel-dark);
    }

    ::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, #d3d3d3, #bfbfbf);
      border: 2px solid;
      border-color: var(--bevel-light) var(--bevel-darker) var(--bevel-darker) var(--bevel-light);
    }

    body.dark ::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, #5a6672, #434d57);
    }
  </style>
</head>

<body>
  <div class="app" id="app"></div>

  <script>
    /* =========================================================
       Data
       ========================================================= */
    const CATEGORIES = ["Mekan","Nesne","Zaman","Kişi","Eylem","Duygu"];

    const CATEGORY_COLORS = {
      "Mekan": "#8eaad1",
      "Nesne": "#a5b7c9",
      "Zaman": "#8fb6c9",
      "Kişi": "#a4b58f",
      "Eylem": "#94baa0",
      "Duygu": "#b2a1c7"
    };

    const DEFAULT_REFS = {
      "Mekan": ["Kafe","Kütüphane","Metro","Orman"],
      "Nesne": ["Anahtar","Eski defter","Cep saati","Radyo"],
      "Zaman": ["Gece yarısı","Yağmurlu akşam","Sabah erken","1998 yazı"],
      "Kişi": ["Dedektif","Garson","Çocuk","Yabancı"],
      "Eylem": ["Araştırmak","Beklemek","Kaçmak","Hatırlamak"],
      "Duygu": ["Gerilim","Merak","Hüzün","Umut"]
    };

    const STORAGE_KEYS = {
      notes: "w98_notes_v2",
      refs: "w98_refs_v2",
      theme: "w98_theme_v2"
    };

    let state = {
      notes: readStorage(STORAGE_KEYS.notes, []),
      refs: readStorage(STORAGE_KEYS.refs, DEFAULT_REFS),
      theme: readStorage(STORAGE_KEYS.theme, "light"),
      noteSearch: "",
      archiveSearch: "",
      route: { name: "home" }
    };

    if (state.theme === "dark") {
      document.body.classList.add("dark");
    }

    normalizeState();
    render();

    /* =========================================================
       Storage helpers
       ========================================================= */
    function readStorage(key, fallback){
      try{
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      }catch{
        return fallback;
      }
    }

    function saveState(){
      localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(state.notes));
      localStorage.setItem(STORAGE_KEYS.refs, JSON.stringify(state.refs));
      localStorage.setItem(STORAGE_KEYS.theme, JSON.stringify(state.theme));
    }

    function normalizeState(){
      if (!Array.isArray(state.notes)) state.notes = [];
      if (!state.refs || typeof state.refs !== "object") state.refs = structuredClone(DEFAULT_REFS);

      CATEGORIES.forEach(cat => {
        if (!Array.isArray(state.refs[cat])) {
          state.refs[cat] = [...DEFAULT_REFS[cat]];
        }
        state.refs[cat] = dedupeStrings(state.refs[cat]);
      });

      state.notes = state.notes.map(note => ({
        id: note.id || (Date.now() + Math.random()),
        title: typeof note.title === "string" ? note.title : "",
        body: typeof note.body === "string" ? note.body : "",
        refs: note.refs && typeof note.refs === "object" ? note.refs : {},
        created: typeof note.created === "number" ? note.created : Date.now(),
        updated: typeof note.updated === "number" ? note.updated : Date.now()
      }));
      saveState();
    }

    function dedupeStrings(list){
      const seen = new Set();
      const result = [];
      for (const item of list) {
        const value = String(item || "").trim();
        const key = value.toLocaleLowerCase("tr");
        if (!value || seen.has(key)) continue;
        seen.add(key);
        result.push(value);
      }
      return result;
    }

    /* =========================================================
       Utilities
       ========================================================= */
    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function formatDate(ts){
      try{
        return new Date(ts).toLocaleString("tr-TR");
      }catch{
        return "-";
      }
    }

    function randomFrom(list){
      return list && list.length ? list[Math.floor(Math.random() * list.length)] : "";
    }

    function sortNotesByUpdated(){
      return [...state.notes].sort((a,b) => b.updated - a.updated);
    }

    function getNoteById(id){
      return state.notes.find(note => String(note.id) === String(id));
    }

    function touchNote(note){
      note.updated = Date.now();
      saveState();
    }

    function navigate(route){
      state.route = route;
      render();
    }

    function render(){
      const app = document.getElementById("app");
      let inner = "";

      switch(state.route.name){
        case "note":
          inner = renderShell("Not Düzenleyici", renderNoteScreen(state.route.id));
          break;
        case "archive":
          inner = renderShell(state.route.category + " Arşivi", renderArchiveScreen(state.route.category));
          break;
        default:
          inner = renderShell("Sistem Özellikleri", renderHomeScreen());
      }

      app.innerHTML = inner;
      if (state.route.name === "archive") {
        renderArchiveList(state.route.category);
      }
      if (state.route.name === "home") {
        renderHomeSearchResults();
      }
    }

    function renderShell(windowTitle, content){
      return `
        <div class="win-window">
          <div class="win-titlebar">
            <div class="win-titlebar-left">
              <div class="win-titlebar-dot"></div>
              <span>${escapeHtml(windowTitle)}</span>
            </div>
            <div class="win-controls">
              <div class="win-control">_</div>
              <div class="win-control">□</div>
              <div class="win-control">×</div>
            </div>
          </div>
          <div class="win-content">
            <div class="tabs">
              <div class="tab active">Genel</div>
              <div class="tab">Araçlar</div>
              <div class="tab">Yardımcı Referanslar</div>
              <div class="tab">Bakım</div>
            </div>
            ${content}
            <div class="status-bar">
              <div class="status-pane">Windows 98 Not ve Referans Sistemi</div>
              <div class="status-pane">${state.theme === "dark" ? "Koyu Tema" : "Açık Tema"}</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================
       Home screen
       ========================================================= */
    function renderHomeScreen(){
      const recentNotes = sortNotesByUpdated().slice(0, 8);

      return `
        <div class="home-grid">
          <div>
            <div class="section">
              <div class="section-title">Not İşlemleri</div>
              <div class="toolbar">
                <button class="btn full" onclick="createNewNote()">Yeni Not Oluştur</button>
              </div>

              <label for="home-note-search">Not arama</label>
              <input
                id="home-note-search"
                type="text"
                placeholder="Başlık veya içerik ara..."
                value="${escapeHtml(state.noteSearch)}"
                oninput="updateHomeNoteSearch(this.value)"
              />
              <div id="home-search-results" class="notes-search-results"></div>
            </div>

            <div class="section">
              <div class="section-title">Son Notlara Devam Et</div>
              <div class="recent-list">
                ${
                  recentNotes.length
                    ? recentNotes.map(note => `
                      <div class="recent-card" onclick="openNote('${escapeHtml(note.id)}')">
                        <div class="recent-title">${escapeHtml(note.title || "Adsız Not")}</div>
                        <div class="small muted">Son düzenleme: ${formatDate(note.updated)}</div>
                      </div>
                    `).join("")
                    : `<div class="muted">Henüz kayıtlı not yok.</div>`
                }
              </div>
            </div>

            <div class="section">
              <div class="section-title">Veri ve Tema</div>
              <div class="toolbar">
                <button class="btn" onclick="toggleTheme()">Koyu / Açık Mod</button>
                <button class="btn" onclick="exportJSON()">JSON Dışa Aktar</button>
              </div>
              <label for="json-import-input">JSON İçe Aktar</label>
              <input id="json-import-input" type="file" accept="application/json" onchange="importJSON(event)" />
              <div class="helper">Yedek alabilir ve geri yükleyebilirsin.</div>
            </div>
          </div>

          <div>
            <div class="section">
              <div class="section-title">Referans Kutuları</div>
              <div class="category-grid">
                ${CATEGORIES.map(cat => `
                  <button
                    class="category-btn"
                    style="--cat-color:${CATEGORY_COLORS[cat] || '#9aa'}"
                    onclick="openArchive('${cat}')"
                    title="${escapeHtml(cat)} arşivini aç"
                  >
                    <div class="category-icon"></div>
                    <div>
                      <div class="category-name">${escapeHtml(cat)}</div>
                      <div class="category-meta">${(state.refs[cat] || []).length} kayıt</div>
                    </div>
                  </button>
                `).join("")}
              </div>
            </div>

            <div class="section">
              <div class="section-title">Bugünün İlham Kartı</div>
              <div class="inspiration-wrap">
                ${renderDailyInspiration()}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDailyInspiration(){
      return CATEGORIES.map(cat => {
        const value = randomFrom(state.refs[cat] || []) || "-";
        return `<span class="info-chip">${escapeHtml(cat)}: ${escapeHtml(value)}</span>`;
      }).join("");
    }

    function updateHomeNoteSearch(value){
      state.noteSearch = value;
      renderHomeSearchResults();
    }

    function renderHomeSearchResults(){
      const box = document.getElementById("home-search-results");
      if (!box) return;

      const query = (state.noteSearch || "").trim().toLocaleLowerCase("tr");
      if (!query) {
        box.innerHTML = "";
        return;
      }

      const results = sortNotesByUpdated().filter(note => {
        const haystack = (note.title + " " + note.body).toLocaleLowerCase("tr");
        return haystack.includes(query);
      });

      box.innerHTML = results.length
        ? results.map(note => `
            <div class="recent-card" onclick="openNote('${escapeHtml(note.id)}')">
              <div class="recent-title">${escapeHtml(note.title || "Adsız Not")}</div>
              <div class="small muted">${formatDate(note.updated)}</div>
            </div>
          `).join("")
        : `<div class="muted">Sonuç bulunamadı.</div>`;
    }

    /* =========================================================
       Note screen
       ========================================================= */
    function renderNoteScreen(noteId){
      const note = getNoteById(noteId);
      if (!note) {
        return `
          <div class="section">
            <div class="section-title">Uyarı</div>
            <div class="muted">Not bulunamadı.</div>
            <div style="margin-top:10px">
              <button class="btn" onclick="goHome()">Ana Sayfaya Dön</button>
            </div>
          </div>
        `;
      }

      const selectedRefs = CATEGORIES.filter(cat => note.refs[cat]);

      return `
        <div class="note-layout">
          <div class="toolbar">
            <button class="btn" onclick="goHome()">Ana Sayfaya Dön</button>
            <button class="btn" onclick="applyRandomReferences('${escapeHtml(note.id)}')">Rastgele Referans Üret</button>
            <button class="btn danger" onclick="deleteNote('${escapeHtml(note.id)}')">Notu Sil</button>
          </div>

          <div class="section">
            <div class="section-title">Yeni Not Oluşturma Ekranı</div>

            <label for="note-title-input">Not başlığı</label>
            <input
              id="note-title-input"
              type="text"
              placeholder="Not başlığı yaz..."
              value="${escapeHtml(note.title)}"
              oninput="updateNoteField('${escapeHtml(note.id)}','title',this.value)"
            />

            <label>Not bloğu</label>
            <div class="terminal-shell">
              <div class="terminal-topbar">
                <span>C:\\NOTLAR\\EDITOR.EXE</span>
                <span class="small">Yazım modu: aktif</span>
              </div>
              <div class="terminal-inner">
                <div class="terminal-refline">
                  ${
                    selectedRefs.length
                      ? selectedRefs.map(cat => `
                        <span class="terminal-chip">[${escapeHtml(cat)}: ${escapeHtml(note.refs[cat])}]</span>
                      `).join("")
                      : `<span class="small" style="color:var(--terminal-muted)">[Referans etiketi yok] Seçtiğin mekan, kişi, duygu ve diğer alanlar burada soluk bilgi etiketi gibi görünür.</span>`
                  }
                </div>
                <textarea
                  id="note-body-input"
                  class="terminal-textarea"
                  placeholder="> notunu yazmaya başla..."
                  oninput="updateNoteField('${escapeHtml(note.id)}','body',this.value)"
                >${escapeHtml(note.body)}</textarea>

                <div class="terminal-status">
                  <span>CREATED: ${formatDate(note.created)}</span>
                  <span>UPDATED: ${formatDate(note.updated)}</span>
                  <span>AUTOSAVE: ON</span>
                </div>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">Referans Seçimi</div>
            <div class="reference-grid">
              ${CATEGORIES.map(cat => `
                <div class="reference-card">
                  <label for="ref-${escapeHtml(cat)}">${escapeHtml(cat)}</label>
                  <select id="ref-${escapeHtml(cat)}" onchange="setNoteReference('${escapeHtml(note.id)}','${escapeHtml(cat)}',this.value)">
                    <option value="">Seçilmedi</option>
                    ${(state.refs[cat] || []).map(item => `
                      <option value="${escapeHtml(item)}" ${note.refs[cat] === item ? "selected" : ""}>${escapeHtml(item)}</option>
                    `).join("")}
                  </select>
                </div>
              `).join("")}
            </div>
            <div class="helper">Seçtiğin öğeler not bloğunun en üstünde referans etiketi olarak görünür.</div>
          </div>
        </div>
      `;
    }

    function createNewNote(){
      const note = {
        id: String(Date.now()) + String(Math.floor(Math.random() * 10000)),
        title: "",
        body: "",
        refs: {},
        created: Date.now(),
        updated: Date.now()
      };
      state.notes.unshift(note);
      saveState();
      navigate({ name: "note", id: note.id });
    }

    function openNote(id){
      navigate({ name: "note", id: String(id) });
    }

    function updateNoteField(noteId, field, value){
      const note = getNoteById(noteId);
      if (!note) return;
      note[field] = value;
      touchNote(note);

      const statusBits = document.querySelector(".terminal-status");
      if (statusBits) {
        statusBits.innerHTML = `
          <span>CREATED: ${formatDate(note.created)}</span>
          <span>UPDATED: ${formatDate(note.updated)}</span>
          <span>AUTOSAVE: ON</span>
        `;
      }
    }

    function setNoteReference(noteId, category, value){
      const note = getNoteById(noteId);
      if (!note) return;

      if (value) note.refs[category] = value;
      else delete note.refs[category];

      touchNote(note);
      navigate({ name: "note", id: noteId });
    }

    function applyRandomReferences(noteId){
      const note = getNoteById(noteId);
      if (!note) return;

      CATEGORIES.forEach(cat => {
        const chosen = randomFrom(state.refs[cat] || []);
        if (chosen) note.refs[cat] = chosen;
      });

      touchNote(note);
      navigate({ name: "note", id: noteId });
    }

    function deleteNote(noteId){
      const note = getNoteById(noteId);
      if (!note) return;
      const ok = confirm(`"${note.title || "Adsız Not"}" silinsin mi?`);
      if (!ok) return;

      state.notes = state.notes.filter(n => String(n.id) !== String(noteId));
      saveState();
      goHome();
    }

    /* =========================================================
       Archive screen
       ========================================================= */
    function renderArchiveScreen(category){
      if (!CATEGORIES.includes(category)) {
        return `
          <div class="section">
            <div class="section-title">Uyarı</div>
            <div class="muted">Arşiv bulunamadı.</div>
            <div style="margin-top:10px">
              <button class="btn" onclick="goHome()">Ana Sayfaya Dön</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="toolbar">
          <button class="btn" onclick="goHome()">Ana Sayfaya Dön</button>
        </div>

        <div class="archive-grid">
          <div>
            <div class="section">
              <div class="section-title">${escapeHtml(category)} Arşivi</div>

              <label for="archive-search-input">Arama</label>
              <input
                id="archive-search-input"
                type="text"
                placeholder="${escapeHtml(category)} içinde ara..."
                value="${escapeHtml(state.archiveSearch)}"
                oninput="updateArchiveSearch(this.value)"
              />

              <div class="divider"></div>

              <label for="archive-single-input">Tek tek öğe ekleme</label>
              <input id="archive-single-input" type="text" placeholder="Örnek: Kafe" />
              <div style="margin-top:8px">
                <button class="btn full" onclick="addSingleArchiveItem('${escapeHtml(category)}')">Öğe Ekle</button>
              </div>

              <div class="divider"></div>

              <label for="archive-bulk-input">Toplu öğe ekleme</label>
              <textarea id="archive-bulk-input" rows="7" placeholder="Ev&#10;Kütüphane&#10;Metro&#10;Orman&#10;&#10;veya&#10;Ev, Kütüphane, Metro, Orman"></textarea>
              <div style="margin-top:8px">
                <button class="btn full" onclick="addBulkArchiveItems('${escapeHtml(category)}')">Toplu Ekle</button>
              </div>
            </div>
          </div>

          <div>
            <div class="section">
              <div class="section-title">Mevcut Öğeler</div>
              <div id="archive-list" class="archive-list"></div>
            </div>
          </div>
        </div>
      `;
    }

    function openArchive(category){
      state.archiveSearch = "";
      navigate({ name: "archive", category });
    }

    function updateArchiveSearch(value){
      state.archiveSearch = value;
      if (state.route.name === "archive") {
        renderArchiveList(state.route.category);
      }
    }

    function renderArchiveList(category){
      const container = document.getElementById("archive-list");
      if (!container) return;

      const items = state.refs[category] || [];
      const query = (state.archiveSearch || "").trim().toLocaleLowerCase("tr");

      const filtered = items
        .map((value, index) => ({ value, index }))
        .filter(item => item.value.toLocaleLowerCase("tr").includes(query));

      container.innerHTML = filtered.length
        ? filtered.map(item => `
            <div class="archive-item">
              <div class="archive-item-value">${escapeHtml(item.value)}</div>
              <button class="btn" onclick="editArchiveItem('${escapeHtml(category)}', ${item.index})">Düzenle</button>
              <button class="btn danger" onclick="deleteArchiveItem('${escapeHtml(category)}', ${item.index})">Sil</button>
            </div>
          `).join("")
        : `<div class="muted">Kayıt bulunamadı.</div>`;
    }

    function addSingleArchiveItem(category){
      const input = document.getElementById("archive-single-input");
      if (!input) return;
      const value = input.value.trim();
      if (!value) return;

      state.refs[category] = dedupeStrings([...(state.refs[category] || []), value]);
      input.value = "";
      saveState();
      renderArchiveList(category);
    }

    function addBulkArchiveItems(category){
      const textarea = document.getElementById("archive-bulk-input");
      if (!textarea) return;

      const raw = textarea.value || "";
      const items = raw
        .split(/,|\n/g)
        .map(v => v.trim())
        .filter(Boolean);

      if (!items.length) return;

      state.refs[category] = dedupeStrings([...(state.refs[category] || []), ...items]);
      textarea.value = "";
      saveState();
      renderArchiveList(category);
    }

    function editArchiveItem(category, index){
      const current = state.refs[category]?.[index];
      if (typeof current !== "string") return;

      const next = prompt("Yeni değer:", current);
      if (next === null) return;

      const trimmed = next.trim();
      if (!trimmed) return;

      const oldValue = current;
      state.refs[category][index] = trimmed;
      state.refs[category] = dedupeStrings(state.refs[category]);

      /* Optional consistency: update note references using this old value */
      state.notes.forEach(note => {
        if (note.refs && note.refs[category] === oldValue) {
          note.refs[category] = trimmed;
          note.updated = Date.now();
        }
      });

      saveState();
      renderArchiveList(category);
    }

    function deleteArchiveItem(category, index){
      const current = state.refs[category]?.[index];
      if (typeof current !== "string") return;

      const ok = confirm(`"${current}" silinsin mi?`);
      if (!ok) return;

      state.refs[category].splice(index, 1);
      saveState();
      renderArchiveList(category);
    }

    /* =========================================================
       Theme / import / export
       ========================================================= */
    function toggleTheme(){
      document.body.classList.toggle("dark");
      state.theme = document.body.classList.contains("dark") ? "dark" : "light";
      saveState();
      render();
    }

    function exportJSON(){
      const exportData = {
        notes: state.notes,
        refs: state.refs,
        theme: state.theme
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "windows98-not-arsivi.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event){
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);

          state.notes = Array.isArray(parsed.notes) ? parsed.notes : [];
          state.refs = parsed.refs && typeof parsed.refs === "object" ? parsed.refs : structuredClone(DEFAULT_REFS);
          state.theme = parsed.theme === "dark" ? "dark" : "light";

          normalizeState();
          document.body.classList.toggle("dark", state.theme === "dark");
          saveState();
          goHome();
        }catch{
          alert("Geçersiz JSON dosyası.");
        }finally{
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    /* =========================================================
       Navigation helpers
       ========================================================= */
    function goHome(){
      navigate({ name: "home" });
    }

    /* Expose functions for inline handlers */
    window.createNewNote = createNewNote;
    window.openNote = openNote;
    window.updateNoteField = updateNoteField;
    window.setNoteReference = setNoteReference;
    window.applyRandomReferences = applyRandomReferences;
    window.deleteNote = deleteNote;
    window.goHome = goHome;
    window.openArchive = openArchive;
    window.updateArchiveSearch = updateArchiveSearch;
    window.addSingleArchiveItem = addSingleArchiveItem;
    window.addBulkArchiveItems = addBulkArchiveItems;
    window.editArchiveItem = editArchiveItem;
    window.deleteArchiveItem = deleteArchiveItem;
    window.toggleTheme = toggleTheme;
    window.exportJSON = exportJSON;
    window.importJSON = importJSON;
    window.updateHomeNoteSearch = updateHomeNoteSearch;
  </script>
</body>
</html>
