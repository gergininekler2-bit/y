<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Flashcard App</title>
    <style>
        /* Fütüristik & Bohem Temel Renkler (Karanlık Mod Varsayılan) */
        :root {
            --bg: #0A0A0F;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-border: rgba(255, 255, 255, 0.08);
            --accent: #E2B378; /* Bohem Kum/Altın */
            --accent-glow: rgba(226, 179, 120, 0.2);
            --text: #F0F0F2;
            --text-muted: #8A8A93;
            --danger: #FF5E5E;
            --success: #32E0C4;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Aydınlık Mod Seçeneği */
        [data-theme="light"] {
            --bg: #F4F3F0;
            --surface: #FFFFFF;
            --surface-border: #E0DFDB;
            --accent: #C28E46;
            --accent-glow: rgba(194, 142, 70, 0.2);
            --text: #2C2C30;
            --text-muted: #73737A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Üst Menü */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--surface-border);
        }

        .logo { font-weight: 700; font-size: 1.4rem; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }

        .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
        }

        .timer { font-family: monospace; font-size: 1.2rem; color: var(--accent); }
        
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-toggle:hover { border-color: var(--accent); }

        main {
            flex: 1;
            padding: 30px 5%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Netflix Tarzı Klasör Kartları */
        .section-title { margin-bottom: 15px; font-size: 1.2rem; font-weight: 600; }
        
        .deck-slider {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-snap-type: x mandatory;
        }
        
        .deck-slider::-webkit-scrollbar { height: 6px; }
        .deck-slider::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 10px; }

        .deck-card {
            flex: 0 0 auto;
            width: 160px;
            height: 160px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            scroll-snap-align: start;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .deck-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .deck-card h3 { font-size: 1.1rem; word-wrap: break-word; }
        .deck-card .count { font-size: 0.85rem; color: var(--text-muted); }

        .add-deck-card {
            border: 1px dashed var(--text-muted);
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        /* Panel Geçişleri */
        .panel { display: none; animation: fadeIn 0.4s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Soru Ekleme Ekranı (İçeri Taşma Korumalı) */
        .editor-container {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--accent); }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--surface-border); color: var(--text); }

        .question-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .q-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            word-break: break-word; /* Metin taşmalarını engeller */
        }
        
        .q-text { flex: 1; padding-right: 10px; }
        .q-item button {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0; /* Butonun ezilip taşmasını engeller */
        }

        /* Fütüristik Çalışma Ekranı */
        .study-area { max-width: 600px; margin: 0 auto; text-align: center; }
        
        .progress-container {
            width: 100%; height: 6px; background: var(--surface-border);
            border-radius: 3px; margin: 20px 0; overflow: hidden;
        }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; }

        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 350px;
            margin-bottom: 30px;
        }

        .flashcard {
            width: 100%; height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-size: 1.4rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .card-back { transform: rotateY(180deg); border-color: var(--accent); }

        .action-buttons {
            display: flex; gap: 15px; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .action-buttons.visible { opacity: 1; pointer-events: auto; }
        .action-buttons button { flex: 1; }
        .btn-zor { background: var(--danger); color: white; }
        .btn-normal { background: var(--text-muted); color: white; }
        .btn-kolay { background: var(--success); color: black; }

        .top-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }

    </style>
</head>
<body>

    <header>
        <div class="logo">Nexus<span>Cards</span></div>
        <div class="header-right">
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
            <div class="timer" id="timer">00:00</div>
        </div>
    </header>

    <main>
        <!-- ANA EKRAN: KLASÖRLER -->
        <div id="panel-home" class="panel active">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 class="section-title">Klasörlerim</h2>
                <button class="btn btn-outline" style="padding: 6px 12px;" onclick="promptNewDeck()">+ Yeni Klasör</button>
            </div>
            
            <div class="deck-slider" id="deck-list">
                <!-- JS ile Doldurulacak -->
            </div>
        </div>

        <!-- DÜZENLEME EKRANI: KART EKLEME -->
        <div id="panel-editor" class="panel">
            <div class="top-bar">
                <button class="btn btn-outline" onclick="showPanel('panel-home')">← Geri</button>
                <button class="btn" onclick="startStudy()">Çalışmaya Başla ▶</button>
            </div>
            
            <h2 id="editor-title" style="margin-bottom: 20px;">Klasör Düzenle</h2>
            
            <div class="editor-container">
                <h3>Yeni Kart Ekle</h3>
                <div class="input-group" style="margin-top: 15px;">
                    <input type="text" id="input-q" placeholder="Soru / Ön Yüz">
                    <textarea id="input-a" placeholder="Cevap / Arka Yüz" rows="3"></textarea>
                    <button class="btn" onclick="addCard()">Listeye Ekle</button>
                </div>
                
                <h4 style="margin-top: 30px; border-bottom: 1px solid var(--surface-border); padding-bottom: 10px;">Bu Klasördeki Kartlar</h4>
                <div class="question-list" id="question-list">
                    <!-- JS ile Doldurulacak -->
                </div>
            </div>
        </div>

        <!-- ÇALIŞMA EKRANI -->
        <div id="panel-study" class="panel">
            <div class="study-area">
                <div class="top-bar">
                    <button class="btn btn-outline" onclick="showPanel('panel-home')">← Bitir</button>
                    <span id="card-counter" style="color: var(--text-muted); font-weight: bold;">0 / 0</span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>

                <div class="flashcard-wrapper" onclick="flipCard()">
                    <div class="flashcard" id="flashcard">
                        <div class="card-face card-front" id="card-front">Soru Yükleniyor...</div>
                        <div class="card-face card-back" id="card-back">Cevap Yükleniyor...</div>
                    </div>
                </div>

                <div class="action-buttons" id="action-buttons">
                    <button class="btn btn-zor" onclick="answerCard('zor')">Zor</button>
                    <button class="btn btn-normal" onclick="answerCard('normal')">Normal</button>
                    <button class="btn btn-kolay" onclick="answerCard('kolay')">Kolay</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Veritabanı Yapısı (Tarayıcı Hafızası)
        let db = JSON.parse(localStorage.getItem('nexus_db')) || {};
        let currentDeck = null;
        
        // Çalışma Algoritması Değişkenleri
        let studyQueue = [];
        let completedCount = 0;
        let totalCards = 0;
        
        // Kronometre
        let seconds = 0;
        setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);

        // Tema Yönetimi
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', target);
        }

        function saveDB() {
            localStorage.setItem('nexus_db', JSON.stringify(db));
            renderHome();
        }

        // --- PANEL YÖNETİMİ ---
        function showPanel(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            if(panelId === 'panel-home') renderHome();
        }

        // --- ANA EKRAN ---
        function renderHome() {
            const list = document.getElementById('deck-list');
            list.innerHTML = '';
            
            for (let deckName in db) {
                list.innerHTML += `
                    <div class="deck-card" onclick="openEditor('${deckName}')">
                        <h3>${deckName}</h3>
                        <div class="count">${db[deckName].length} Kart</div>
                    </div>
                `;
            }
        }

        function promptNewDeck() {
            const name = prompt("Yeni klasörün (kitabın/dersin) adını girin:");
            if (name && !db[name]) {
                db[name] = [];
                saveDB();
            } else if (db[name]) {
                alert("Bu isimde bir klasör zaten var!");
            }
        }

        // --- EDİTÖR EKRANI ---
        function openEditor(deckName) {
            currentDeck = deckName;
            document.getElementById('editor-title').innerText = deckName;
            renderQuestionList();
            showPanel('panel-editor');
        }

        function renderQuestionList() {
            const list = document.getElementById('question-list');
            list.innerHTML = '';
            // Verileri döngüyle basıyoruz. Yeni eklenenler en üstte görünecek şekilde kurgulandı.
            db[currentDeck].forEach((card, index) => {
                list.innerHTML += `
                    <div class="q-item">
                        <div class="q-text"><strong>S:</strong> ${card.q}</div>
                        <button onclick="deleteCard(${index})">Sil</button>
                    </div>
                `;
            });
        }

        function addCard() {
            const q = document.getElementById('input-q').value.trim();
            const a = document.getElementById('input-a').value.trim();
            if (q && a) {
                // unshift ile listeye en başından ekliyoruz (listenin en başına ekler)
                db[currentDeck].unshift({ q, a }); 
                document.getElementById('input-q').value = '';
                document.getElementById('input-a').value = '';
                saveDB();
                renderQuestionList();
            }
        }

        function deleteCard(index) {
            if(confirm("Bu kartı silmek istiyor musunuz?")) {
                db[currentDeck].splice(index, 1);
                saveDB();
                renderQuestionList();
            }
        }

        // --- ÇALIŞMA EKRANI ---
        function startStudy() {
            if (db[currentDeck].length === 0) {
                alert("Önce bu klasöre kart eklemelisiniz!");
                return;
            }
            
            // Diziyi karıştır
            studyQueue = [...db[currentDeck]].sort(() => Math.random() - 0.5);
            completedCount = 0;
            totalCards = studyQueue.length;
            
            showPanel('panel-study');
            nextCard();
        }

        function nextCard() {
            if (studyQueue.length === 0) {
                alert("Harika! Bu klasördeki tüm kartları tamamladın.");
                showPanel('panel-home');
                return;
            }

            const card = studyQueue[0];
            document.getElementById('card-front').innerText = card.q;
            document.getElementById('card-back').innerText = card.a;
            
            document.getElementById('card-counter').innerText = `${completedCount} / ${totalCards}`;
            document.getElementById('progress-bar').style.width = `${(completedCount / totalCards) * 100}%`;

            resetCardUI();
        }

        function flipCard() {
            const fc = document.getElementById('flashcard');
            if (!fc.classList.contains('flipped')) {
                fc.classList.add('flipped');
                document.getElementById('action-buttons').classList.add('visible');
            }
        }

        function resetCardUI() {
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('action-buttons').classList.remove('visible');
        }

        function answerCard(difficulty) {
            const card = studyQueue.shift();

            if (difficulty === 'zor') {
                // Zor dendiyse hemen 2 kart sonrasına tekrar sıkıştır
                const index = Math.min(2, studyQueue.length);
                studyQueue.splice(index, 0, card);
                totalCards++; 
            } else if (difficulty === 'normal') {
                // Normal dendiyse en sona at
                studyQueue.push(card);
                totalCards++;
            } else {
                completedCount++;
            }

            resetCardUI();
            setTimeout(nextCard, 300); // Dönüş animasyonu bitmeden yazılar değişmesin diye gecikme
        }

        // Başlangıç
        renderHome();
    </script>
</body>
</html>
