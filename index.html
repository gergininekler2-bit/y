<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPL 1003 - 7 Günlük Sınav Kampı</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef3fb; --text:#152033; --muted:#60708a;
  --line:#dbe4f0; --accent:#2563eb; --accent2:#10b981; --danger:#ef4444; --warn:#f59e0b;
  --shadow:0 18px 40px rgba(15,23,42,.10); --radius:20px;
}
[data-theme="dark"]{
  --bg:#07111f; --panel:#0f1b2e; --panel2:#13233a; --text:#e9f1ff; --muted:#9fb0c9;
  --line:#263750; --accent:#60a5fa; --accent2:#34d399; --danger:#fb7185; --warn:#fbbf24;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg);
  color:var(--text); line-height:1.5;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1320px;margin:0 auto;padding:22px}
.hero{
  background:linear-gradient(135deg,var(--panel),var(--panel2)); border:1px solid var(--line);
  border-radius:28px; padding:22px; box-shadow:var(--shadow); position:sticky; top:0; z-index:20;
}
.hero-top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand h1{margin:0;font-size:clamp(24px,4vw,40px);letter-spacing:-.03em}
.brand p{margin:4px 0 0;color:var(--muted)}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill, .mini-pill{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--text);border-radius:999px;padding:10px 14px;box-shadow:0 8px 18px rgba(0,0,0,.04)
}
.mini-pill{padding:6px 10px;font-size:13px;color:var(--muted)}
.theme-toggle{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px}
.theme-toggle button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:999px}
.theme-toggle button.active{background:var(--accent);color:white}
.tabs{display:flex;gap:8px;overflow:auto;margin-top:18px;padding-bottom:2px}
.tab-btn{
  border:1px solid var(--line); background:var(--panel); color:var(--muted); padding:10px 14px; border-radius:14px;
  white-space:nowrap; transition:.2s;
}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 10px 20px rgba(37,99,235,.18)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section{margin-top:20px}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);
}
.card h2,.card h3,.card h4{margin-top:0;letter-spacing:-.02em}
.card h2{font-size:26px;margin-bottom:8px}
.card h3{font-size:19px;margin-bottom:8px}
.muted{color:var(--muted)}
.stat-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.stat-value{font-size:30px;font-weight:800;letter-spacing:-.04em}
.progress{height:12px;background:var(--panel2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:.25s}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.badge.green{background:rgba(16,185,129,.12);color:var(--accent2)}
.badge.blue{background:rgba(37,99,235,.12);color:var(--accent)}
.badge.red{background:rgba(239,68,68,.12);color:var(--danger)}
.badge.yellow{background:rgba(245,158,11,.12);color:var(--warn)}
.btn{
  border:1px solid var(--line); background:var(--panel2); color:var(--text); padding:10px 14px;
  border-radius:14px; transition:.15s; display:inline-flex;gap:8px;align-items:center;justify-content:center;
}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.good{background:var(--accent2);color:#062016;border-color:var(--accent2)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.warn{background:var(--warn);color:#201300;border-color:var(--warn)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 10px;font-size:13px;border-radius:10px}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.task input{margin-top:5px;transform:scale(1.1)}
.topic-nav,.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.topic-nav button,.filter-row button{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:999px
}
.topic-nav button.active,.filter-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
details{border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:12px;margin:10px 0}
summary{font-weight:800;cursor:pointer}
.summary-content{padding-top:10px;color:var(--muted)}
.list-clean{padding-left:20px;margin:8px 0}
.question-box{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:18px}
.option{
  width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--text);
  padding:13px 14px;border-radius:14px;margin:8px 0;display:flex;gap:10px;align-items:flex-start;transition:.15s
}
.option:hover{border-color:var(--accent);transform:translateY(-1px)}
.option.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.option.correct{border-color:var(--accent2);background:rgba(16,185,129,.12)}
.option.wrong{border-color:var(--danger);background:rgba(239,68,68,.12)}
.option-letter{font-weight:900;min-width:24px}
.result{border-radius:16px;padding:14px;margin-top:12px;border:1px solid var(--line)}
.result.good{background:rgba(16,185,129,.12)}
.result.bad{background:rgba(239,68,68,.12)}
.result.blank{background:rgba(245,158,11,.12)}
.form-row{display:grid;gap:10px;margin-bottom:12px}
.form-row label{font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:11px 12px}
textarea{min-height:90px;resize:vertical}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:13px}
.hide{display:none!important}
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-box{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel2)}
.source-note{font-size:12px;color:var(--muted);margin-top:10px}
.footer{margin:26px 0;color:var(--muted);font-size:13px;text-align:center}
.alert{border-left:5px solid var(--accent);background:var(--panel2);padding:12px 14px;border-radius:12px;margin:10px 0}
@media(max-width:900px){
  .grid-2,.grid-3,.grid-4,.kpi-row{grid-template-columns:1fr}
  .comparison{grid-template-columns:1fr}
  .hero{position:relative}
}
</style>
</head>

function hashCode(str){
  let h=0; for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i); h|=0;} return Math.abs(h);
}
function shuffleSeed(arr, seedStr){
  const out = [...arr]; let seed = hashCode(seedStr)+1;
  function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for(let i=out.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
function makeQuestions(){
  const templates = [
    f => `${f.key} konusunda aşağıdakilerden hangisi doğrudur?`,
    f => `${f.subtopic} başlığında sınavda doğru kabul edilecek ifade hangisidir?`,
    f => `${topicName(f.topic)} / ${f.subtopic} için en güvenli cevap hangisidir?`,
    f => `Aşağıdakilerden hangisi "${f.key}" için ayırt edici bilgidir?`
  ];
  const all = [];
  DATA.facts.forEach((f, idx)=>{
    templates.forEach((tpl, v)=>{
      const optsRaw = [f.correct, ...f.wrongs.slice(0,4)];
      const opts = shuffleSeed(optsRaw, `${idx}-${v}-${f.key}`);
      all.push({
        id:`q_${idx}_${v}`,
        factIndex:idx, variant:v, topic:f.topic, subtopic:f.subtopic, key:f.key,
        difficulty:f.difficulty, tag:f.tag, q:tpl(f), options:opts, answer:f.correct,
        explanation:f.explanation
      });
    });
  });
  return all;
}
const QUESTIONS = makeQuestions();

function topicName(id){ return DATA.topics.find(t=>t.id===id)?.name || id; }
function byId(id){ return document.getElementById(id); }
function pct(num, den){ return den ? Math.round((num/den)*100) : 0; }
function answeredStats(){
  const vals = Object.values(state.answers || {});
  return {
    total: vals.length,
    correct: vals.filter(a=>a.status==="correct").length,
    wrong: vals.filter(a=>a.status==="wrong").length,
    blank: vals.filter(a=>a.status==="blank").length
  };
}
function taskStats(){
  const total = DATA.plan.reduce((s,d)=>s+d.tasks.length,0);
  let done = 0;
  DATA.plan.forEach(d=>d.tasks.forEach((_,i)=>{ if(state.tasks[`d${d.day}_${i}`]) done++; }));
  return {done,total};
}
function refreshHeader(){
  document.documentElement.setAttribute("data-theme", state.theme || "dark");
  byId("lightBtn")?.classList.toggle("active", state.theme==="light");
  byId("darkBtn")?.classList.toggle("active", state.theme==="dark");
  byId("questionCountText").textContent = QUESTIONS.length;
  const ts = taskStats(); const as = answeredStats();
  const totalUnits = ts.total + QUESTIONS.length;
  const doneUnits = ts.done + as.total;
  const p = pct(doneUnits,totalUnits);
  byId("globalProgressText").textContent = `%${p}`;
  byId("globalProgressBar").style.width = `${p}%`;
}

}

function renderTests(){

function topicStats(topicId){
  const qs = QUESTIONS.filter(q=>q.topic===topicId).map(q=>q.id);
  const ans = Object.entries(state.answers).filter(([id])=>qs.includes(id)).map(x=>x[1]);
  return {solved:ans.length, correct:ans.filter(a=>a.status==="correct").length, wrong:ans.filter(a=>a.status==="wrong").length, blank:ans.filter(a=>a.status==="blank").length};
}
function startTest(topicId, subtopic=null, difficulty=null){
  let pool = QUESTIONS;
  if(topicId && topicId!=="all") pool = pool.filter(q=>q.topic===topicId);
  if(subtopic) pool = pool.filter(q=>q.subtopic===subtopic);
  if(difficulty) pool = pool.filter(q=>q.difficulty===difficulty);
  pool = shuffleSeed(pool, `${topicId}-${subtopic||''}-${difficulty||''}-${Date.now()}`).slice(0, Math.min(pool.length, 80));
  testSession = {pool, index:0, selected:null, checked:false};
  activeTab = "tests"; render();
}
function startWrongTest(){
  const ids = new Set((state.wrongs||[]).map(w=>w.qid));
  let pool = QUESTIONS.filter(q=>ids.has(q.id));
  if(!pool.length){ alert("Henüz yanlış soru yok."); return; }
  pool = shuffleSeed(pool, `wrong-${Date.now()}`);
  testSession = {pool, index:0, selected:null, checked:false};
  activeTab = "tests"; render();
}
function renderTestSession(){
  const s = testSession; const q = s.pool[s.index];
  if(!q) { testSession=null; return renderTests(); }
  const answered = state.answers[q.id];
  const selected = s.selected ?? answered?.selected ?? null;
  const checked = s.checked || !!answered;
  return `
  <div class="card">
    <button class="btn small" onclick="testSession=null;render()">← Testlerden çık</button>
    <span class="mini-pill">${topicName(q.topic)}</span>
    <span class="mini-pill">${q.subtopic}</span>
    <span class="mini-pill">${q.difficulty}</span>
    <h2>Soru ${s.index+1} / ${s.pool.length}</h2>
    <div class="progress"><span style="width:${pct(s.index,s.pool.length)}%"></span></div>
  </div>
  <div class="question-box section">
    <h3>${escapeHtml(q.q)}</h3>
    <div id="options">
      ${q.options.map((o,i)=>{
        let cls = "option";
        if(selected===o) cls += " selected";
        if(checked && o===q.answer) cls += " correct";
        if(checked && selected===o && o!==q.answer) cls += " wrong";
        return `<button class="${cls}" onclick="selectOption('${encodeURIComponent(o)}')" ${checked?"disabled":""}><span class="option-letter">${letters[i]})</span><span>${escapeHtml(o)}</span></button>`;
      }).join("")}
    </div>
    <div class="filter-row">
      ${!checked?`<button class="btn primary" onclick="checkAnswer()">Kontrol Et</button><button class="btn warn" onclick="markBlank()">Boş Bıraktım</button>`:""}
      ${checked?`<button class="btn primary" onclick="nextQuestion()">Sonraki Soru</button><button class="btn danger" onclick="addWrongFromQuestion('${q.id}', true)">Yanlış Defterine Ekle</button>`:""}
    </div>
    ${checked ? renderQuestionResult(q, selected) : ""}
  </div>`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[s]));
}
function selectOption(enc){
  if(!testSession || testSession.checked) return;
  testSession.selected = decodeURIComponent(enc); render();
}
function checkAnswer(){
  const s = testSession; if(!s) return;
  const q = s.pool[s.index];
  if(!s.selected){ alert("Önce bir şık seç kankam."); return; }
  const status = s.selected===q.answer ? "correct" : "wrong";
  state.answers[q.id] = {status, selected:s.selected, at:Date.now(), topic:q.topic, subtopic:q.subtopic};
  if(status==="wrong") addWrongFromQuestion(q.id, false);
  s.checked = true; saveState(); render();
}
function markBlank(){
  const s = testSession; if(!s) return;
  const q = s.pool[s.index];
  state.answers[q.id] = {status:"blank", selected:null, at:Date.now(), topic:q.topic, subtopic:q.subtopic};
  addWrongFromQuestion(q.id, false, "Boş bırakıldı");
  s.checked = true; saveState(); render();
}
function renderQuestionResult(q, selected){
  const status = !selected ? "blank" : selected===q.answer ? "good" : "bad";
  const title = status==="good" ? "Doğru bildin ✅" : status==="bad" ? "Yanlış ❌" : "Boş bırakıldı ⚠️";
  return `<div class="result ${status}">
    <strong>${title}</strong>
    <p><strong>Doğru cevap:</strong> ${escapeHtml(q.answer)}</p>
    <p><strong>Açıklama:</strong> ${escapeHtml(q.explanation)}</p>
  </div>`;
}
function nextQuestion(){
  if(!testSession) return;
  testSession.index++;
  testSession.selected=null; testSession.checked=false;
  if(testSession.index>=testSession.pool.length){
    alert("Test bitti. İlerleme sekmesinden sonucuna bakabilirsin.");
    testSession=null;
  }
  render();
}
function addWrongFromQuestion(qid, notify=false, note=""){
  const q = QUESTIONS.find(x=>x.id===qid); if(!q) return;
  if(!(state.wrongs||[]).some(w=>w.qid===qid)){
    state.wrongs.push({id:`w_${Date.now()}_${Math.random().toString(16).slice(2)}`, qid, topic:q.topic, subtopic:q.subtopic, key:q.key, question:q.q, answer:q.answer, explanation:q.explanation, note, critical:q.difficulty==="Zor", reviewed:false, at:Date.now()});
    saveState();
  }
  if(notify) alert("Yanlış defterine eklendi.");
}

  if(examSession) return renderExamSession();
  return `
  <div class="card">

function startExam(n){
  const pool = shuffleSeed(QUESTIONS, `exam-${Date.now()}`).slice(0,n);
  examSession = {pool,index:0,answers:{},finished:false}; render();
}
function startExamWeak(){
  if(!state.wrongs.length){ alert("Zayıf deneme için önce yanlış kaydı oluşmalı."); return; }
  const keys = new Set(state.wrongs.map(w=>`${w.topic}|${w.subtopic}`));
  let pool = QUESTIONS.filter(q=>keys.has(`${q.topic}|${q.subtopic}`));
  pool = shuffleSeed(pool, `weak-${Date.now()}`).slice(0, Math.min(40,pool.length));
  examSession = {pool,index:0,answers:{},finished:false}; render();
}
function renderExamSession(){
  const s = examSession;
  if(s.finished) return renderExamResult();
  const q = s.pool[s.index]; const selected = s.answers[q.id] || null;
  return `<div class="card">
    <button class="btn small" onclick="examSession=null;render()">← Denemeden çık</button>
    <h2>Deneme Soru ${s.index+1} / ${s.pool.length}</h2>
    <div class="progress"><span style="width:${pct(s.index,s.pool.length)}%"></span></div>
  </div>

    <span class="mini-pill">${topicName(q.topic)} / ${q.subtopic}</span>
    <h3>${escapeHtml(q.q)}</h3>
    ${q.options.map((o,i)=>`<button class="option ${selected===o?'selected':''}" onclick="examSelect('${q.id}','${encodeURIComponent(o)}')"><span class="option-letter">${letters[i]})</span><span>${escapeHtml(o)}</span></button>`).join("")}
    <div class="filter-row">
      <button class="btn" onclick="examPrev()">Önceki</button>
      <button class="btn primary" onclick="examNext()">${s.index===s.pool.length-1?'Bitir':'Sonraki'}</button>
      <button class="btn warn" onclick="examBlank('${q.id}')">Boş</button>
    </div>
  </div>`;
}
function examSelect(qid, enc){ examSession.answers[qid]=decodeURIComponent(enc); render(); }
function examBlank(qid){ examSession.answers[qid]=null; render(); }
function examPrev(){ if(examSession.index>0) examSession.index--; render(); }
function examNext(){
  if(examSession.index < examSession.pool.length-1) examSession.index++;
  else {
    examSession.finished=true;
    examSession.pool.forEach(q=>{
      const sel = examSession.answers.hasOwnProperty(q.id)?examSession.answers[q.id]:null;
      const status = sel===null ? "blank" : sel===q.answer ? "correct" : "wrong";
      state.answers[q.id] = {status, selected:sel, at:Date.now(), topic:q.topic, subtopic:q.subtopic};
      if(status!=="correct") addWrongFromQuestion(q.id,false,status==="blank"?"Denemede boş":"Denemede yanlış");
    });
    saveState();
  }
  render();
}

  </div>
  <div class="grid grid-2 section">
    ${DATA.topics.map(t=>`<div class="card">
      <h3>${t.name}</h3>
      <ol class="list-clean">${(DATA.finalNotes[t.id]||[]).map(x=>`<li>${escapeHtml(x)}</li>`).join("")}</ol>
      <button class="btn small primary" onclick="startTest('${t.id}')">Bu konudan son test</button>
    </div>`).join("")}
  </div>`;
}
function renderProgress(){
  const as = answeredStats();
  return `${renderKpis()}
  <div class="grid grid-2 section">
    <div class="card">
      <h2>Konu Bazlı Başarı</h2>
      ${DATA.topics.map(t=>{
        const st = topicStats(t.id); const total = QUESTIONS.filter(q=>q.topic===t.id).length; const acc = pct(st.correct, st.correct+st.wrong);
        return `<div style="margin:14px 0">
          <div style="display:flex;justify-content:space-between;gap:10px"><strong>${t.name}</strong><span class="muted">${st.solved}/${total} · %${acc}</span></div>
          <div class="progress"><span style="width:${pct(st.solved,total)}%"></span></div>
        </div>`;
      }).join("")}
    </div>
    <div class="card">
      <h2>Zayıf Alan Analizi</h2>
      ${renderWeakAreas()}
      <div class="alert"><strong>Çalışma taktiği:</strong> Yanlış sayısı yüksek olan alt konudan önce 10 dakika özet oku, sonra 20 soru çöz.</div>
    </div>
  </div>
  <div class="card section">
    <h2>Etiket Bazlı Dağılım</h2>
    ${renderTagStats()}
  </div>`;
}
function renderTagStats(){
  const tags = {};
  QUESTIONS.forEach(q=>{ tags[q.tag] = tags[q.tag] || {total:0,solved:0,correct:0,wrong:0}; tags[q.tag].total++; const a=state.answers[q.id]; if(a){tags[q.tag].solved++; if(a.status==="correct")tags[q.tag].correct++; if(a.status==="wrong")tags[q.tag].wrong++;}});
  return `<table><thead><tr><th>Etiket</th><th>Çözülen</th><th>Başarı</th></tr></thead><tbody>${Object.entries(tags).map(([k,v])=>`<tr><td>${k}</td><td>${v.solved}/${v.total}</td><td>%${pct(v.correct, v.correct+v.wrong)}</td></tr>`).join("")}</tbody></table>`;
}
function bindAfterRender(){
  document.querySelectorAll("[data-task]").forEach(cb=>{
    cb.onchange = e=>{ state.tasks[e.target.dataset.task] = e.target.checked; saveState(); refreshHeader(); };
  });
}
function init(){ setTheme(state.theme || "dark"); render(); }
init();
</script>
</body>
</html>
