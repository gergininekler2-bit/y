<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPL 1003 – Sermaye Piyasası Araçları 1 | Test &amp; Sorular</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy2: #0d1f3c;
    --gold: #c9a84c;
    --gold2: #e8c96d;
    --cream: #f5f0e8;
    --text: #e8e4dc;
    --text2: #a8a09a;
    --card: #111e35;
    --card2: #162440;
    --accent1: #3a7bd5;
    --accent2: #00c9a7;
    --accent3: #f7971e;
    --accent4: #e74c3c;
    --accent5: #8e44ad;
    --green: #27ae60;
    --red: #e74c3c;
    --border: rgba(201,168,76,0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  body::before {
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 700px 500px at 75% 10%, rgba(247,151,30,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 500px 700px at 25% 90%, rgba(142,68,173,0.05) 0%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  header {
    position: relative;
    padding: 60px 40px 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(201,168,76,0.06) 0%, transparent 100%);
    z-index:1;
  }

  .badge {
    display: inline-block;
    background: rgba(201,168,76,0.15);
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 6px 18px;
    border-radius: 2px;
    margin-bottom: 20px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 5vw, 50px);
    font-weight: 900;
    color: var(--cream);
    line-height: 1.1;
    margin-bottom: 12px;
  }

  header h1 span { color: var(--gold); }
  header p { color: var(--text2); font-size: 15px; }

  .file-switch {
    display: inline-flex;
    margin-top: 28px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .file-switch a {
    padding: 10px 24px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    transition: all 0.2s;
  }

  .file-switch a.active { background: var(--gold); color: var(--navy); }
  .file-switch a:not(.active) { color: var(--text2); background: var(--card); }
  .file-switch a:not(.active):hover { background: var(--card2); color: var(--text); }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Score dashboard */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }

  .dash-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px;
    padding: 18px 16px;
    text-align: center;
  }

  .dash-val {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
    margin-bottom: 6px;
  }

  .dash-label {
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 0.5px;
  }

  /* Filter tabs */
  .filter-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    align-items: center;
  }

  .filter-btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text2);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .filter-btn:hover { background: var(--card2); color: var(--text); }
  .filter-btn.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }

  .reset-btn {
    margin-left: auto;
    padding: 8px 20px;
    background: rgba(231,76,60,0.15);
    border: 1px solid rgba(231,76,60,0.35);
    color: var(--red);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
  }

  .reset-btn:hover { background: rgba(231,76,60,0.25); }

  /* Question card */
  .question-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    margin-bottom: 20px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .question-card.answered-correct { border-color: rgba(39,174,96,0.4); }
  .question-card.answered-wrong { border-color: rgba(231,76,60,0.4); }

  .q-top {
    padding: 20px 22px 16px;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 1px;
  }

  .q-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.3px;
  }

  .q-tag.s1 { background: rgba(58,123,213,0.2); color: #6fa8e8; }
  .q-tag.s2 { background: rgba(247,151,30,0.2); color: #f7b85e; }
  .q-tag.s3 { background: rgba(0,201,167,0.2); color: #4dd9c0; }
  .q-tag.s4 { background: rgba(142,68,173,0.2); color: #b87fd6; }
  .q-tag.s5 { background: rgba(231,76,60,0.2); color: #ee8070; }

  .q-diff {
    font-size: 11px;
    margin-left: auto;
    color: var(--text2);
  }

  .q-text {
    font-size: 15px;
    color: var(--cream);
    line-height: 1.7;
    font-weight: 400;
  }

  /* Options */
  .options {
    padding: 0 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    background: var(--navy2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 5px;
    color: var(--text2);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.5;
  }

  .option-btn:not(.locked):hover {
    background: var(--card2);
    color: var(--text);
    border-color: rgba(255,255,255,0.15);
  }

  .option-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    min-width: 20px;
    padding-top: 1px;
  }

  .option-btn.correct {
    background: rgba(39,174,96,0.15);
    border-color: rgba(39,174,96,0.5);
    color: #6ec98a;
  }

  .option-btn.wrong {
    background: rgba(231,76,60,0.12);
    border-color: rgba(231,76,60,0.4);
    color: #e87870;
  }

  .option-btn.show-correct {
    background: rgba(39,174,96,0.1);
    border-color: rgba(39,174,96,0.3);
    color: #5db87a;
  }

  .option-btn.locked { cursor: default; }

  /* Explanation */
  .explanation {
    display: none;
    padding: 14px 22px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  .explanation.visible { display: block; }

  .expl-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .expl-text {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.8;
  }

  .expl-text strong { color: var(--cream); }

  /* Result badge */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .result-badge.correct { background: rgba(39,174,96,0.2); color: #6ec98a; }
  .result-badge.wrong { background: rgba(231,76,60,0.15); color: #e87870; }

  /* Progress bar */
  .prog-container {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    height: 6px;
    margin-bottom: 32px;
    overflow: hidden;
  }

  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent2));
    border-radius: 10px;
    transition: width 0.4s ease;
  }

  /* Hidden question */
  .question-card.hidden { display: none; }

  /* Responsive */
  @media (max-width: 600px) {
    header { padding: 40px 20px 28px; }
    .container { padding: 24px 14px 60px; }
    .dashboard { grid-template-columns: repeat(2, 1fr); }
    .q-text { font-size: 14px; }
    .option-btn { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <div class="badge">SPL · Ders Kodu 1003 · TEST</div>
  <h1>Sermaye Piyasası <span>Araçları 1</span></h1>
  <p>Bölüm bölüm sınav soruları — cevabına tıkla, açıklamayı gör</p>
  <div class="file-switch">
    <a href="konu.html">📚 Konu Özetleri</a>
    <a href="#" class="active">📝 Test &amp; Sorular</a>
  </div>
</header>

<div class="container">

  <!-- Dashboard -->
  <div class="dashboard">
    <div class="dash-card">
      <div class="dash-val" id="stat-total">40</div>
      <div class="dash-label">Toplam Soru</div>
    </div>
    <div class="dash-card">
      <div class="dash-val" id="stat-answered" style="color:var(--accent2)">0</div>
      <div class="dash-label">Cevaplanan</div>
    </div>
    <div class="dash-card">
      <div class="dash-val" id="stat-correct" style="color:#6ec98a">0</div>
      <div class="dash-label">Doğru</div>
    </div>
    <div class="dash-card">
      <div class="dash-val" id="stat-pct" style="color:var(--gold)">—</div>
      <div class="dash-label">Başarı %</div>
    </div>
  </div>

  <div class="prog-container">
    <div class="prog-fill" id="prog-fill" style="width:0%"></div>
  </div>

  <!-- Filters -->
  <div class="filter-row">
    <button class="filter-btn active" onclick="filterSection('all', this)">Tümü</button>
    <button class="filter-btn" onclick="filterSection('s1', this)">① Paylar</button>
    <button class="filter-btn" onclick="filterSection('s2', this)">② Borçlanma</button>
    <button class="filter-btn" onclick="filterSection('s3', this)">③ Yatırım Fonu</button>
    <button class="filter-btn" onclick="filterSection('s4', this)">④ Türev Araçlar</button>
    <button class="filter-btn" onclick="filterSection('s5', this)">⑤ Kamu DİBS</button>
    <button class="reset-btn" onclick="resetAll()">↺ Sıfırla</button>
  </div>

  <!-- Questions will be rendered here -->
  <div id="questions-container"></div>

</div>

<script>
const questions = [
  // ===== BÖLÜM 1: PAYLAR =====
  {
    id: 1, section: 's1', sectionName: 'Paylar',
    text: "Türk Ticaret Kanunu'na göre bir payın itibari (nominal) değeri en az kaç olabilir?",
    options: ["1 TL", "1 Kuruş (Kr)", "10 Kuruş", "50 Kuruş"],
    correct: 1,
    explanation: "TTK Madde 476 uyarınca bir payın nominal değeri <strong>1 Kuruş'tan az olamaz</strong>. Borsada işlem gören şirketlerde genellikle 1 TL uygulanmaktadır, ancak yasal alt sınır 1 Kr'dır."
  },
  {
    id: 2, section: 's1', sectionName: 'Paylar',
    text: "Bir payın birden fazla sahibi olması durumunda, bu kişiler ortaklığa karşı haklarını nasıl kullanır?",
    options: ["Her biri ayrı ayrı kullanır", "Ortak bir temsilci aracılığıyla kullanır", "En büyük paya sahip olan kullanır", "Ortaklıktan izin alarak kullanır"],
    correct: 1,
    explanation: "Pay ortaklığa karşı bölünmez. Birden fazla sahibi olması halinde, bu kişiler haklarını <strong>ortak bir temsilci aracılığıyla</strong> kullanabilirler. Temsilci atanmazsa, pay sahiplerinden birine yapılan tebligat diğerlerine de yapılmış sayılır."
  },
  {
    id: 3, section: 's1', sectionName: 'Paylar',
    text: "Pay sahiplerinin getiri unsurları aşağıdakilerden hangisini içermez?",
    options: ["Kâr payı (temettü)", "Değer artış kazancı", "Tasfiye sonucuna katılım", "Sabit faiz geliri"],
    correct: 3,
    explanation: "Payın getirisi; <strong>kâr payı, tasfiye sonucuna katılım ve değer artış kazancı</strong>ndan oluşur. Sabit faiz geliri borçlanma araçlarına (tahvil, bono) özgüdür — payın vadesi ve sabit getirisi yoktur."
  },
  {
    id: 4, section: 's1', sectionName: 'Paylar',
    text: "Ortaklığın iflası ya da tasfiyesi durumunda ödeme sıralamasında pay sahipleri hangi konumdadır?",
    options: ["En önde — alacaklılardan önce alır", "Tahvil sahiplerinden önce alır", "Tüm borçlar kapandıktan sonra en sonda alır", "Tahvil sahipleriyle eşit sırada alır"],
    correct: 2,
    explanation: "Pay sahipleri, iflas veya tasfiye durumunda <strong>tüm borçlar (borçlanma araçları dahil) kapandıktan sonra kalan artık üzerinden</strong> haklarını alır. Bu 'artık talep hakkı' onları en yüksek riskli konuma koyar."
  },
  {
    id: 5, section: 's1', sectionName: 'Paylar',
    text: "Halka arzdan sonra fiyat istikrarı sağlayıcı işlemler en fazla kaç gün sürebilir?",
    options: ["15 gün", "30 gün", "60 gün", "90 gün"],
    correct: 1,
    explanation: "Fiyat istikrarı sağlayıcı işlemler, halka arzdan itibaren en fazla <strong>30 gün</strong> sürebilir. Bu işlemler yalnızca izahnameye eklenmiş plan çerçevesinde yetkili kuruluşlar tarafından yapılabilir."
  },
  {
    id: 6, section: 's1', sectionName: 'Paylar',
    text: "Bedelli sermaye artırımında artırım tutarının en az yüzde kaçı tescilden önce ödenmelidir?",
    options: ["%25", "%50", "%75", "%100"],
    correct: 2,
    explanation: "Bedelli sermaye artırımında artırım tutarının <strong>en az %75'i</strong> tescilden önce ödenmelidir. Kalan %25 ise tescilden itibaren 24 ay içinde ödenir."
  },
  {
    id: 7, section: 's1', sectionName: 'Paylar',
    text: "Bedelsiz sermaye artırımının kaynakları arasında aşağıdakilerden hangisi yer almaz?",
    options: ["Olağanüstü yedek akçeler", "Geçmiş yıl kârları", "Yeni pay bedelleri (nakdi katkı)", "Emisyon primleri"],
    correct: 2,
    explanation: "Bedelsiz sermaye artırımı <strong>iç kaynaklardan</strong> yapılır; yeni pay bedeli ödenmez. Kaynaklar: olağanüstü yedekler, geçmiş yıl kârları, emisyon primleri, enflasyon düzeltmesi farkları, gayrimenkul/iştirak satış kazançları. 'Nakdi katkı' bedelli artırıma aittir."
  },
  {
    id: 8, section: 's1', sectionName: 'Paylar',
    text: "Şarta bağlı sermaye artırımında artırım miktarı mevcut sermayenin en fazla kaçında olabilir?",
    options: ["%25", "%50", "%75", "%100"],
    correct: 1,
    explanation: "Şarta bağlı sermaye artırımı miktarı <strong>mevcut sermayenin %50'sini</strong> aşamaz. Bu artırım; tahvil sahiplerine pay dönüştürme hakkı verilmesi, çalışan opsiyonları gibi belirli koşullara bağlıdır."
  },
  {
    id: 9, section: 's1', sectionName: 'Paylar',
    text: "Katılma İntifa Senetleri (KİS) hakkında aşağıdakilerden hangisi yanlıştır?",
    options: ["Kar payı hakkı verir", "Tasfiye artığına katılım hakkı verir", "Ortaklık (oy) hakkı verir", "Halka açık anonim ortaklıklar tarafından çıkarılabilir"],
    correct: 2,
    explanation: "Katılma İntifa Senetleri (KİS); <strong>ortaklık (oy) hakkı vermez</strong>. KİS sahipleri kâr payı ve tasfiye artığına katılım hakkı kazanır ancak genel kurulda oy kullanamazlar. Bu en temel KİS özelliğidir."
  },
  {
    id: 10, section: 's1', sectionName: 'Paylar',
    text: "Oy imtiyazlı paylar için oy hakkı en fazla kaç kata kadar olabilir?",
    options: ["5 kat", "10 kat", "15 kat", "20 kat"],
    correct: 2,
    explanation: "Oy imtiyazı en fazla <strong>15 kata</strong> kadar tanınabilir. Yani bir imtiyazlı pay, adi paya kıyasla oy sayısı bakımından en fazla 15 oy hakkı sağlayabilir."
  },

  // ===== BÖLÜM 2: BORÇLANMA ARAÇLARI =====
  {
    id: 11, section: 's2', sectionName: 'Borçlanma',
    text: "Aşağıdakilerden hangisi menkul kıymet sayılmaz?",
    options: ["Tahvil", "Hisse senedi", "Poliçe", "Finansman bonosu"],
    correct: 2,
    explanation: "SPK tanımına göre; <strong>para, çek, poliçe ve bono</strong> menkul kıymet kapsamı dışındadır. Bunlar kıymetli evrak olmakla birlikte standart hâlde seri ihraç edilen menkul kıymet niteliği taşımaz."
  },
  {
    id: 12, section: 's2', sectionName: 'Borçlanma',
    text: "Derecelendirme notu bulunmayan şirketler için borçlanma aracı ihraç limiti nasıl belirlenir?",
    options: ["Özkaynak × 1", "Özkaynak × 2", "Özkaynak × 3", "Özkaynak × 5"],
    correct: 2,
    explanation: "Kredi derecelendirme notu bulunmayan ihraçcılar (bankalar hariç) için borçlanma aracı ihraç limiti <strong>özkaynağın 3 katı</strong>dır. Derecelendirme notu varlığında bu limit artırılabilir."
  },
  {
    id: 13, section: 's2', sectionName: 'Borçlanma',
    text: "Paya Dönüştürülebilir Tahvil (PDT) ile Değiştirilebilir Tahvil (DET) arasındaki temel fark nedir?",
    options: [
      "PDT vadesiz, DET vadeli borçlanma aracıdır",
      "PDT ihraçcı şirketin payına dönüşür, DET başka bir ortaklığın payına dönüşür",
      "PDT faiz öder, DET ödemez",
      "PDT yalnızca borsada işlem görür, DET görmez"
    ],
    correct: 1,
    explanation: "PDT; ihraçcı şirketin kendi payına dönüştürülür. DET ise <strong>ihraçcının elindeki başka bir ortaklığın payına</strong> dönüştürülür. İkisi de hisse dönüşümü içerir ancak hedef şirket farklıdır."
  },
  {
    id: 14, section: 's2', sectionName: 'Borçlanma',
    text: "Finansman bonolarının en temel özelliği aşağıdakilerden hangisidir?",
    options: ["Vadesi 5 yıldan uzundur", "Kupon faizi ödenir", "Kısa vadeli ve iskontolu ihraç edilir", "Yalnızca devlet çıkarabilir"],
    correct: 2,
    explanation: "Finansman bonoları; vadeleri <strong>1 yıl veya daha kısa</strong> olan ve <strong>iskontolu</strong> olarak ihraç edilen kısa vadeli borçlanma araçlarıdır. Dönemsel faiz (kupon) ödemesi yapılmaz; getiri, alış ile itfa değeri arasındaki farktır."
  },
  {
    id: 15, section: 's2', sectionName: 'Borçlanma',
    text: "Borçlanma Aracı Sahipleri Kurulu hangi tebliğ kapsamında düzenlenmektedir?",
    options: ["VII-128.1", "VII-128.8", "II-31/A.1", "III-52.1"],
    correct: 2,
    explanation: "Borçlanma Aracı Sahipleri Kurulu <strong>II-31/A.1 sayılı Tebliğ</strong> kapsamında düzenlenmektedir. Bu tebliğ; tahvil sahiplerinin kolektif karar alma mekanizmasını, temsilci kuruluş atanmasını ve olağanüstü durumlarda toplanma esaslarını belirler."
  },
  {
    id: 16, section: 's2', sectionName: 'Borçlanma',
    text: "Aşağıdaki yeşil tahvil türlerinden hangisinde, belirlenen sürdürülebilirlik hedeflerine ulaşılıp ulaşılmamasına göre faiz oranı değişir?",

// State
let answered = 0, correct = 0;
let currentFilter = 'all';

function renderQuestions(filter) {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  const visible = filter === 'all' ? questions : questions.filter(q => q.section === filter);
  document.getElementById('stat-total').textContent = visible.length;

  visible.forEach((q, idx) => {
    const letters = ['A', 'B', 'C', 'D'];
    const optHTML = q.options.map((opt, i) =>
      `<button class="option-btn" id="q${q.id}-opt${i}" onclick="answer(${q.id}, ${i}, ${q.correct})">`+
      `<span class="option-letter">${letters[i]}</span><span>${opt}</span></button>`
    ).join('');

    container.insertAdjacentHTML('beforeend', `
      <div class="question-card" id="qcard-${q.id}">
        <div class="q-top">
          <div class="q-meta">
            <span class="q-num">S-${String(idx+1).padStart(2,'0')}</span>
            <span class="q-tag ${q.section}">${q.sectionName}</span>
          </div>
          <div class="q-text">${q.text}</div>
        </div>
        <div class="options">${optHTML}</div>
        <div class="explanation" id="expl-${q.id}">
          <div class="result-badge" id="badge-${q.id}"></div>
          <div class="expl-title">📖 Açıklama</div>
          <div class="expl-text">${q.explanation}</div>
        </div>
      </div>
    `);
  });
}

function answer(qId, chosen, correctIdx) {
  const card = document.getElementById(`qcard-${qId}`);
  if (card.classList.contains('answered-correct') || card.classList.contains('answered-wrong')) return;

  const opts = card.querySelectorAll('.option-btn');
  opts.forEach((btn, i) => {
    btn.classList.add('locked');
    if (i === correctIdx) btn.classList.add('show-correct');
    if (i === chosen && chosen !== correctIdx) btn.classList.add('wrong');
    if (i === chosen && chosen === correctIdx) btn.classList.remove('show-correct');
  });

  if (chosen === correctIdx) {
    opts[chosen].classList.add('correct');
    card.classList.add('answered-correct');
  } else {
    opts[chosen].classList.add('wrong');
    opts[correctIdx].classList.remove('show-correct');
    opts[correctIdx].classList.add('correct');
    card.classList.add('answered-wrong');
  }

  const expl = document.getElementById(`expl-${qId}`);
  expl.classList.add('visible');

  const badge = document.getElementById(`badge-${qId}`);
  if (chosen === correctIdx) {
    badge.className = 'result-badge correct';
    badge.innerHTML = '✓ Doğru';
    correct++;
  } else {
    badge.className = 'result-badge wrong';
    badge.innerHTML = '✗ Yanlış';
  }

  answered++;
  updateStats();
}

function updateStats() {
  const visible = currentFilter === 'all' ? questions : questions.filter(q => q.section === currentFilter);
  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('stat-pct').textContent = answered > 0 ? pct + '%' : '—';
  const progPct = (answered / visible.length) * 100;
  document.getElementById('prog-fill').style.width = Math.min(progPct, 100) + '%';
}

function filterSection(sec, btn) {
  currentFilter = sec;
  answered = 0; correct = 0;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderQuestions(sec);
  updateStats();
}

function resetAll() {
  answered = 0; correct = 0;
  renderQuestions(currentFilter);
  updateStats();
}

// Init
renderQuestions('all');
updateStats();
</script>
